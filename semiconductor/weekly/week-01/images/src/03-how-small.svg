<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="Liberation Sans, Arial, sans-serif">
  <rect width="1400" height="600" fill="#FFFFFF"/>
  <text x="700" y="55" font-size="30" font-weight="bold" fill="#0B1F33" text-anchor="middle">How small is a nanometre (nm)? 1 nm = one billionth of a metre</text>
  <!-- axis -->
  <line x1="80" y1="330" x2="1320" y2="330" stroke="#14202E" stroke-width="4"/>
  <path d="M1320,330 l-16,-10 v20 z" fill="#14202E"/>
  <text x="80" y="580" font-size="20" fill="#5B7083">← bigger</text>
  <text x="1320" y="580" font-size="20" fill="#5B7083" text-anchor="end">smaller →   (each step ≈ 10× smaller)</text>

  <!-- items: x positions on log scale -->
  <!-- hair 80,000 nm -->
  <g transform="translate(140,0)">
    <rect x="-14" y="150" width="28" height="160" rx="12" fill="#5B4636"/>
    <circle cx="0" cy="330" r="9" fill="#14202E"/>
    <text x="0" y="380" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">Human hair</text>
    <text x="0" y="408" font-size="20" fill="#5B7083" text-anchor="middle">~80,000 nm wide</text>
  </g>
  <!-- red blood cell 7,000 nm -->
  <g transform="translate(330,0)">
    <ellipse cx="0" cy="250" rx="55" ry="38" fill="#B23A48"/>
    <ellipse cx="0" cy="250" rx="25" ry="15" fill="#8E2433"/>
    <circle cx="0" cy="330" r="9" fill="#14202E"/>
    <text x="0" y="380" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">Red blood cell</text>
    <text x="0" y="408" font-size="20" fill="#5B7083" text-anchor="middle">~7,000 nm</text>
  </g>
  <!-- bacterium 1,000 nm -->
  <g transform="translate(520,0)">
    <rect x="-45" y="230" width="90" height="40" rx="20" fill="#2A9D8F"/>
    <path d="M45,250 q20,-15 35,5" stroke="#2A9D8F" stroke-width="4" fill="none"/>
    <circle cx="0" cy="330" r="9" fill="#14202E"/>
    <text x="0" y="380" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">Bacterium</text>
    <text x="0" y="408" font-size="20" fill="#5B7083" text-anchor="middle">~1,000 nm</text>
  </g>
  <!-- virus 100 nm -->
  <g transform="translate(710,0)">
    <circle cx="0" cy="250" r="28" fill="#E9C46A" stroke="#C8763A" stroke-width="4"/>
    <g stroke="#C8763A" stroke-width="4">
      <line x1="0" y1="215" x2="0" y2="205"/><line x1="0" y1="285" x2="0" y2="295"/>
      <line x1="-35" y1="250" x2="-45" y2="250"/><line x1="35" y1="250" x2="45" y2="250"/>
      <line x1="25" y1="225" x2="32" y2="218"/><line x1="-25" y1="275" x2="-32" y2="282"/>
      <line x1="-25" y1="225" x2="-32" y2="218"/><line x1="25" y1="275" x2="32" y2="282"/>
    </g>
    <circle cx="0" cy="330" r="9" fill="#14202E"/>
    <text x="0" y="380" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">Virus</text>
    <text x="0" y="408" font-size="20" fill="#5B7083" text-anchor="middle">~100 nm</text>
  </g>
  <!-- transistor gate ~20 nm (highlight) -->
  <g transform="translate(900,0)">
    <rect x="-85" y="120" width="170" height="320" rx="16" fill="#F6E7DA" stroke="#C8763A" stroke-width="3"/>
    <rect x="-30" y="215" width="60" height="45" rx="4" fill="#C8763A"/>
    <rect x="-50" y="260" width="100" height="16" fill="#2A9D8F"/>
    <circle cx="0" cy="330" r="12" fill="#C8763A"/>
    <text x="0" y="160" font-size="20" font-weight="bold" fill="#C8763A" text-anchor="middle">TODAY'S CHIPS</text>
    <text x="0" y="380" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">Transistor</text>
    <text x="0" y="408" font-size="20" fill="#5B7083" text-anchor="middle">gate ~15-20 nm</text>
  </g>
  <!-- DNA 2.5 nm -->
  <g transform="translate(1080,0)">
    <path d="M-20,200 C20,225 20,245 -20,270 C-60,295 -20,300 -20,300" stroke="#2E86C1" stroke-width="5" fill="none"/>
    <path d="M20,200 C-20,225 -20,245 20,270 C60,295 20,300 20,300" stroke="#B23A48" stroke-width="5" fill="none"/>
    <circle cx="0" cy="330" r="9" fill="#14202E"/>
    <text x="0" y="380" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">DNA strand</text>
    <text x="0" y="408" font-size="20" fill="#5B7083" text-anchor="middle">~2.5 nm wide</text>
  </g>
  <!-- silicon atom 0.2 nm -->
  <g transform="translate(1250,0)">
    <circle cx="0" cy="255" r="10" fill="#14202E"/>
    <ellipse cx="0" cy="255" rx="34" ry="14" fill="none" stroke="#5B7083" stroke-width="2"/>
    <ellipse cx="0" cy="255" rx="14" ry="34" fill="none" stroke="#5B7083" stroke-width="2"/>
    <circle cx="0" cy="330" r="9" fill="#14202E"/>
    <text x="0" y="380" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">Silicon atom</text>
    <text x="0" y="408" font-size="20" fill="#5B7083" text-anchor="middle">~0.2 nm</text>
  </g>
  <text x="700" y="500" font-size="23" fill="#14202E" text-anchor="middle">About 4,000 transistor gates side by side would fit across one human hair.</text>
</svg>
