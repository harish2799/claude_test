<text x="1060.0" y="140.0" font-size="21" fill="#0B1F33" text-anchor="start" font-weight="bold">How to read it</text>
<text x="1060.0" y="180.0" font-size="17" fill="#14202E" text-anchor="start" font-weight="bold">Left dot = OFF leak</text>
<text x="1060.0" y="206.0" font-size="17" fill="#5B7083" text-anchor="start">current when the switch</text>
<text x="1060.0" y="232.0" font-size="17" fill="#5B7083" text-anchor="start">should be off</text>
<text x="1060.0" y="272.0" font-size="17" fill="#14202E" text-anchor="start" font-weight="bold">Right dot = ON current</text>
<text x="1060.0" y="298.0" font-size="17" fill="#5B7083" text-anchor="start">how strongly it switches on</text>
<text x="1060.0" y="338.0" font-size="17" fill="#14202E" text-anchor="start" font-weight="bold">Steepness = control</text>
<text x="1060.0" y="364.0" font-size="17" fill="#5B7083" text-anchor="start">best possible at room temp:</text>
<text x="1060.0" y="390.0" font-size="17" fill="#5B7083" text-anchor="start">60 mV per 10× current</text>
<rect x="1060.0" y="438.0" width="26.0" height="8.0" rx="0" fill="#2A9D8F"/>
<text x="1096.0" y="446.0" font-size="16" fill="#14202E" text-anchor="start">well-controlled switch</text>
<rect x="1060.0" y="470.0" width="26.0" height="8.0" rx="0" fill="#B23A48"/>
<text x="1096.0" y="478.0" font-size="16" fill="#14202E" text-anchor="start">short, poorly controlled</text>
<text x="1060.0" y="520.0" font-size="16" fill="#14202E" text-anchor="start">Same ON current, but the red</text>
<text x="1060.0" y="543.0" font-size="16" fill="#14202E" text-anchor="start">one leaks far more when OFF</text>
