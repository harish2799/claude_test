<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="Liberation Sans, Arial, sans-serif">
  <rect width="1400" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse">
      <path d="M0,0 L16,8 L0,16 z" fill="#14202E"/>
    </marker>
    <pattern id="wood" width="40" height="12" patternUnits="userSpaceOnUse">
      <rect width="40" height="12" fill="#E3B47A"/>
      <path d="M0,6 q10,-4 20,0 t20,0" stroke="#C99558" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <!-- left: the 2x4 example -->
  <rect x="30" y="20" width="640" height="580" rx="18" fill="#EEF2F6"/>
  <text x="350" y="70" font-size="28" font-weight="bold" fill="#0B1F33" text-anchor="middle">Everyday example: a "2 × 4" plank</text>
  <!-- label tag -->
  <rect x="100" y="105" width="210" height="70" rx="10" fill="#FFFFFF" stroke="#5B7083" stroke-width="2"/>
  <text x="205" y="138" font-size="20" fill="#5B7083" text-anchor="middle">Sold as</text>
  <text x="205" y="165" font-size="26" font-weight="bold" fill="#14202E" text-anchor="middle">"2 × 4 inch"</text>
  <!-- end view of plank: 1.5 x 3.5 scaled 70px per inch -->
  <rect x="380" y="140" width="105" height="245" fill="url(#wood)" stroke="#8A5A2B" stroke-width="4"/>
  <line x1="380" y1="410" x2="485" y2="410" stroke="#14202E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="432" y="445" font-size="24" font-weight="bold" fill="#14202E" text-anchor="middle">1.5 in</text>
  <line x1="510" y1="140" x2="510" y2="385" stroke="#14202E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="525" y="270" font-size="24" font-weight="bold" fill="#14202E">3.5 in</text>
  <text x="350" y="510" font-size="22" fill="#14202E" text-anchor="middle">The name is a tradition from long ago.</text>
  <text x="350" y="540" font-size="22" fill="#14202E" text-anchor="middle">The real wood is smaller than the label.</text>

  <!-- right: the 3nm chip -->
  <rect x="730" y="20" width="640" height="580" rx="18" fill="#F6E7DA"/>
  <text x="1050" y="70" font-size="28" font-weight="bold" fill="#0B1F33" text-anchor="middle">Chips do the same: "3nm"</text>
  <rect x="800" y="105" width="210" height="70" rx="10" fill="#FFFFFF" stroke="#5B7083" stroke-width="2"/>
  <text x="905" y="138" font-size="20" fill="#5B7083" text-anchor="middle">Sold as</text>
  <text x="905" y="165" font-size="26" font-weight="bold" fill="#14202E" text-anchor="middle">"3 nanometre"</text>
  <!-- row of 4 switches -->
  <g>
    <rect x="800" y="330" width="520" height="40" fill="#2A9D8F"/>
    <rect x="830" y="270" width="45" height="160" fill="#C8763A"/>
    <rect x="950" y="270" width="45" height="160" fill="#C8763A"/>
    <rect x="1070" y="270" width="45" height="160" fill="#C8763A"/>
    <rect x="1190" y="270" width="45" height="160" fill="#C8763A"/>
  </g>
  <line x1="830" y1="250" x2="875" y2="250" stroke="#14202E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="852" y="228" font-size="20" font-weight="bold" fill="#14202E" text-anchor="middle">~20 nm</text>
  <line x1="852" y1="455" x2="972" y2="455" stroke="#14202E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="912" y="490" font-size="20" font-weight="bold" fill="#14202E" text-anchor="middle">~48 nm apart</text>
  <text x="1250" y="235" font-size="18" fill="#5B7083" text-anchor="middle">copper = switch</text>
  <text x="1250" y="258" font-size="18" fill="#5B7083" text-anchor="middle">teal = channel</text>
  <text x="1050" y="540" font-size="22" fill="#14202E" text-anchor="middle">Nothing on a "3nm" chip is actually 3 nm.</text>
  <text x="1050" y="570" font-size="22" fill="#14202E" text-anchor="middle">It's a generation name, like "iPhone 15".</text>
</svg>
