<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="Liberation Sans, Arial, sans-serif">
  <rect width="1400" height="600" fill="#FFFFFF"/>

  <!-- ========== ON panel ========== -->
  <g transform="translate(40,0)">
    <rect x="0" y="20" width="620" height="540" rx="18" fill="#DDF1EE"/>
    <text x="310" y="70" font-size="30" font-weight="bold" fill="#0B1F33" text-anchor="middle">Switch ON = 1</text>
    <!-- source tank -->
    <rect x="40" y="170" width="110" height="200" rx="10" fill="#8FB8DE" stroke="#14202E" stroke-width="3"/>
    <rect x="40" y="230" width="110" height="140" rx="10" fill="#2E86C1"/>
    <text x="95" y="410" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">SOURCE</text>
    <text x="95" y="437" font-size="17" fill="#5B7083" text-anchor="middle">where current</text>
    <text x="95" y="459" font-size="17" fill="#5B7083" text-anchor="middle">comes from</text>
    <!-- pipe -->
    <rect x="150" y="290" width="320" height="50" fill="#5B7083"/>
    <rect x="150" y="298" width="320" height="34" fill="#2E86C1"/>
    <!-- flow arrows -->
    <path d="M175,315 h40 m-12,-10 l12,10 l-12,10" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <path d="M395,315 h40 m-12,-10 l12,10 l-12,10" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <!-- valve body -->
    <rect x="270" y="270" width="80" height="90" rx="8" fill="#C8763A" stroke="#14202E" stroke-width="3"/>
    <!-- open valve: gate lifted -->
    <rect x="300" y="200" width="20" height="70" fill="#14202E"/>
    <rect x="250" y="180" width="120" height="26" rx="13" fill="#C8763A" stroke="#14202E" stroke-width="3"/>
    <text x="310" y="150" font-size="22" font-weight="bold" fill="#C8763A" text-anchor="middle">GATE = the tap handle</text>
    <text x="310" y="122" font-size="17" fill="#5B7083" text-anchor="middle">a small voltage turns it</text>
    <!-- drain tank -->
    <rect x="470" y="170" width="110" height="200" rx="10" fill="#8FB8DE" stroke="#14202E" stroke-width="3"/>
    <rect x="470" y="250" width="110" height="120" rx="10" fill="#2E86C1"/>
    <text x="525" y="410" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">DRAIN</text>
    <text x="525" y="437" font-size="17" fill="#5B7083" text-anchor="middle">where current</text>
    <text x="525" y="459" font-size="17" fill="#5B7083" text-anchor="middle">goes to</text>
    <text x="310" y="520" font-size="22" fill="#14202E" text-anchor="middle">Tap open → current flows through the channel</text>
  </g>

  <!-- ========== OFF panel ========== -->
  <g transform="translate(740,0)">
    <rect x="0" y="20" width="620" height="540" rx="18" fill="#EEF2F6"/>
    <text x="310" y="70" font-size="30" font-weight="bold" fill="#0B1F33" text-anchor="middle">Switch OFF = 0</text>
    <rect x="40" y="170" width="110" height="200" rx="10" fill="#8FB8DE" stroke="#14202E" stroke-width="3"/>
    <rect x="40" y="200" width="110" height="170" rx="10" fill="#2E86C1"/>
    <text x="95" y="410" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">SOURCE</text>
    <rect x="150" y="290" width="320" height="50" fill="#5B7083"/>
    <rect x="150" y="298" width="120" height="34" fill="#2E86C1"/>
    <rect x="350" y="298" width="120" height="34" fill="#D5DDE5"/>
    <!-- closed valve -->
    <rect x="270" y="270" width="80" height="90" rx="8" fill="#C8763A" stroke="#14202E" stroke-width="3"/>
    <rect x="300" y="240" width="20" height="30" fill="#14202E"/>
    <rect x="250" y="225" width="120" height="26" rx="13" fill="#C8763A" stroke="#14202E" stroke-width="3"/>
    <text x="310" y="150" font-size="22" font-weight="bold" fill="#C8763A" text-anchor="middle">GATE closed</text>
    <rect x="470" y="170" width="110" height="200" rx="10" fill="#8FB8DE" stroke="#14202E" stroke-width="3"/>
    <rect x="470" y="340" width="110" height="30" rx="10" fill="#2E86C1"/>
    <text x="525" y="410" font-size="22" font-weight="bold" fill="#0B1F33" text-anchor="middle">DRAIN</text>
    <!-- X -->
    <path d="M385,260 l40,40 m0,-40 l-40,40" stroke="#B23A48" stroke-width="7" stroke-linecap="round"/>
    <text x="310" y="520" font-size="22" fill="#14202E" text-anchor="middle">Tap closed → no current (ideally not a drop!)</text>
  </g>
</svg>
