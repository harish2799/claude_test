<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" font-family="Liberation Sans, Arial, sans-serif">
  <rect width="1400" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C8763A"/>
    </marker>
    <g id="sw">
      <circle cx="0" cy="0" r="6" fill="#0B1F33"/>
      <circle cx="44" cy="0" r="6" fill="#0B1F33"/>
      <line x1="0" y1="0" x2="40" y2="-18" stroke="#C8763A" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Panel 1: phone -->
  <rect x="110" y="70" width="200" height="390" rx="30" fill="#14202E"/>
  <rect x="125" y="100" width="170" height="330" rx="12" fill="#8FB8DE"/>
  <rect x="140" y="120" width="60" height="60" rx="10" fill="#FFFFFF" opacity="0.8"/>
  <rect x="220" y="120" width="60" height="60" rx="10" fill="#FFFFFF" opacity="0.8"/>
  <rect x="140" y="200" width="60" height="60" rx="10" fill="#FFFFFF" opacity="0.8"/>
  <rect x="220" y="200" width="60" height="60" rx="10" fill="#FFFFFF" opacity="0.8"/>
  <!-- the chip inside (x-ray) -->
  <rect x="180" y="320" width="60" height="60" rx="4" fill="#C8763A" stroke="#14202E" stroke-width="3"/>
  <text x="210" y="356" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CHIP</text>
  <text x="210" y="510" font-size="26" font-weight="bold" fill="#0B1F33" text-anchor="middle">1. Your phone</text>
  <text x="210" y="545" font-size="20" fill="#5B7083" text-anchor="middle">has a chip inside, its "brain"</text>

  <!-- zoom lines 1 -> 2 -->
  <line x1="240" y1="320" x2="500" y2="110" stroke="#C8763A" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="240" y1="380" x2="500" y2="420" stroke="#C8763A" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Panel 2: chip -->
  <rect x="500" y="110" width="310" height="310" rx="10" fill="#C8763A"/>
  <rect x="520" y="130" width="125" height="125" rx="6" fill="#0B1F33"/>
  <text x="582" y="190" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">CPU</text>
  <text x="582" y="215" font-size="15" fill="#8FB8DE" text-anchor="middle">runs apps</text>
  <rect x="665" y="130" width="125" height="125" rx="6" fill="#2A9D8F"/>
  <text x="727" y="190" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">GPU</text>
  <text x="727" y="215" font-size="15" fill="#FFFFFF" text-anchor="middle">graphics</text>
  <rect x="520" y="275" width="125" height="125" rx="6" fill="#E9C46A"/>
  <text x="582" y="335" font-size="20" fill="#14202E" text-anchor="middle" font-weight="bold">AI</text>
  <text x="582" y="360" font-size="15" fill="#14202E" text-anchor="middle">engine</text>
  <rect x="665" y="275" width="125" height="125" rx="6" fill="#8FB8DE"/>
  <text x="727" y="335" font-size="20" fill="#14202E" text-anchor="middle" font-weight="bold">Memory</text>
  <text x="727" y="360" font-size="15" fill="#14202E" text-anchor="middle">cache</text>
  <!-- highlighted tiny square to zoom -->
  <rect x="760" y="140" width="22" height="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="655" y="480" font-size="26" font-weight="bold" fill="#0B1F33" text-anchor="middle">2. The chip</text>
  <text x="655" y="515" font-size="20" fill="#5B7083" text-anchor="middle">about the size of your fingernail,</text>
  <text x="655" y="543" font-size="20" fill="#5B7083" text-anchor="middle">with different areas for different jobs</text>

  <!-- zoom lines 2 -> 3 -->
  <line x1="782" y1="140" x2="1030" y2="95" stroke="#C8763A" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="782" y1="162" x2="1030" y2="430" stroke="#C8763A" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Panel 3: magnifier with switches -->
  <circle cx="1170" cy="262" r="175" fill="#EEF2F6" stroke="#14202E" stroke-width="8"/>
  <line x1="1290" y1="390" x2="1350" y2="455" stroke="#14202E" stroke-width="22" stroke-linecap="round"/>
  <g>
    <!-- grid of little switches: each = two dots + lever -->
    <use href="#sw" x="1060" y="170"/><use href="#sw" x="1130" y="170"/><use href="#sw" x="1200" y="170"/>
    <use href="#sw" x="1040" y="235"/><use href="#sw" x="1110" y="235"/><use href="#sw" x="1180" y="235"/><use href="#sw" x="1250" y="235"/>
    <use href="#sw" x="1040" y="300"/><use href="#sw" x="1110" y="300"/><use href="#sw" x="1180" y="300"/><use href="#sw" x="1250" y="300"/>
    <use href="#sw" x="1080" y="365"/><use href="#sw" x="1150" y="365"/><use href="#sw" x="1220" y="365"/>
  </g>
  <text x="1170" y="510" font-size="26" font-weight="bold" fill="#0B1F33" text-anchor="middle">3. Billions of tiny switches</text>
  <text x="1170" y="545" font-size="20" fill="#5B7083" text-anchor="middle">called transistors, each one</text>
  <text x="1170" y="573" font-size="20" fill="#5B7083" text-anchor="middle">is just ON (1) or OFF (0)</text>
</svg>
