name: Weekly podcast audio

on:
  push:
    paths:
      - "semiconductor/weekly/*/podcast-script.md"
      - "semiconductor/tools/make_podcast.py"
      - ".github/workflows/podcast-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-audio-${{ github.ref }}

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semiconductor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install "edge-tts>=7,<8"
      - run: python tools/make_podcast.py --all
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/*/podcast.mp3 weekly/*/podcast.mp3.sha256
          if git diff --cached --quiet; then echo "No audio changes"; exit 0; fi
          git commit -m "Generate podcast audio"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1
