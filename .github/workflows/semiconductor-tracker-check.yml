name: Semiconductor tracker check

on:
  push:
    paths:
      - "semiconductor/**"
      - ".github/workflows/semiconductor-tracker-check.yml"
  workflow_dispatch:

jobs:
  test-and-fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semiconductor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Live fetch (checks every feed URL)
        run: |
          python -m tracker init-db
          python -m tracker fetch | tee fetch.txt
          python -m tracker latest -n 30 | tee latest.txt
      - name: Job summary
        if: always()
        run: |
          {
            echo '## Feed status'; echo '```'; cat fetch.txt 2>/dev/null; echo '```'
            echo '## Latest articles'; echo '```'; cat latest.txt 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
